name: mayperapa
description: >
  Offline-first personal finance app with a local, on-device AI assistant.
  Privacy-first: no cloud dependency for core features or AI inference.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database
  sqflite: ^2.3.3
  sqflite_sqlcipher: ^3.1.0 # encrypted SQLite (SQLCipher)
  path: ^1.9.0
  path_provider: ^2.1.3

  # Secure local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Charts
  fl_chart: ^0.68.0

  # Date/time
  timezone: ^0.9.4
  intl: ^0.19.0

  # Biometrics / auth
  local_auth: ^2.2.0
  
  # Permissions & Notifications
  permission_handler: ^11.0.0
  flutter_local_notifications: ^18.0.1
  
  # HTTP client for model downloads
  http: ^1.1.0
  dio: ^5.4.0

  # On-device ML for local LLM inference via llama.cpp
  # Using latest dev version for automatic Android AAR bundling
  llama_cpp_dart: ^0.9.0-dev.12

  # Utilities
  uuid: ^4.4.0
  crypto: ^3.0.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  decimal: ^3.0.2 # precise decimal arithmetic for money

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  riverpod_generator: ^2.4.0

  mocktail: ^1.0.3
  sqflite_common_ffi: ^2.3.3 # sqflite in unit tests (desktop/CI)

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/models/
    - lib/shared/data/database/migrations/
